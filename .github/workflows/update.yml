name: Update Profile Contributions

on:
  # Scheduled workflows only run from the repository default branch.
  # After this workflow is merged there, GitHub will attempt it hourly (UTC).
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # GitHub-hosted Ubuntu runners include GitHub CLI.
      - name: Configure GitHub CLI
        run: |
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "Missing required secret GH_PAT (repo/org PAT with PR read access)."
            exit 1
          fi
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token

      - name: Update contributions
        run: node scripts/update-readme.js

      - name: Create diff summary
        id: diff
        run: |
          {
            echo 'content<<EOF'
            git diff -- README.md | sed -n '1,200p'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No README changes to commit."
            exit 0
          fi
          git commit -m "chore: update profile contributions"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Check email configuration
        id: email_config
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          if [ -n "$EMAIL_USER" ] && [ -n "$EMAIL_PASS" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send email notification
        if: steps.commit.outputs.changed == 'true' && steps.email_config.outputs.enabled == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "GitHub Profile Updated - Hourly Report"
          to: dhanushka@creately.com
          from: GitHub Actions <${{ secrets.EMAIL_USER }}>
          body: |
            🚀 GitHub Profile Update

            Your profile README has been refreshed.

            View your GitHub profile: https://github.com/dhanushkacreately

            Summary:
            - Contributions section refreshed
            - Latest PR data included

            Diff:
            ${{ steps.diff.outputs.content }}
