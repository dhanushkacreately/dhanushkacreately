name: Update Profile Contributions + Email Report

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # -----------------------
      # 1. Checkout repo
      # -----------------------
      - name: Checkout repo
        uses: actions/checkout@v4

      # -----------------------
      # 2. Setup Node
      # -----------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Create README backup
        run: cp README.md README_old.md

      # -----------------------
      # 3. Install GitHub CLI
      # -----------------------
      - name: Install GitHub CLI
        id: install_gh
        continue-on-error: true
        run: |
          set -o pipefail
          {
            sudo apt update
            sudo apt install gh -y
          } 2>&1 | tee install-gh.log

      # -----------------------
      # 4. Configure GitHub CLI
      # -----------------------
      - name: Configure GitHub CLI
        id: configure_gh
        if: steps.install_gh.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          if [ -z "${{ secrets.GH_PAT }}" ]; then
            echo "Missing required secret GH_PAT (repo/org PAT with PR read access)."
            exit 1
          fi
          echo "${{ secrets.GH_PAT }}" | gh auth login --with-token 2>&1 | tee configure-gh.log

      # -----------------------
      # 5. Generate contributions
      # -----------------------
      - name: Update contributions
        id: update_contributions
        if: steps.install_gh.outcome == 'success' && steps.configure_gh.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          node scripts/update-readme.js 2>&1 | tee update-readme.log

      # -----------------------
      # 6. Create diff
      # -----------------------
      - name: Create diff
        if: steps.update_contributions.outcome == 'success'
        run: diff README_old.md README.md > changes.txt || true

      # -----------------------
      # 7. Commit changes
      # -----------------------
      - name: Commit changes
        id: commit_changes
        if: steps.update_contributions.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add README.md CONTRIBUTIONS.md
          git diff --cached --quiet && echo "changes_made=false" >> "$GITHUB_OUTPUT" && exit 0
          echo "changes_made=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore: update profile contributions"
          git push 2>&1 | tee commit.log

      - name: Build email content
        id: email_content
        if: always() && (steps.install_gh.outcome == 'failure' || steps.configure_gh.outcome == 'failure' || steps.update_contributions.outcome == 'failure' || steps.commit_changes.outcome == 'failure' || steps.commit_changes.outputs.changes_made == 'true')
        run: |
          STATUS="success"
          REASON="README update completed successfully."
          LOG_FILE=""

          if [ "${{ steps.install_gh.outcome }}" = "failure" ]; then
            STATUS="failure"
            REASON="Installing GitHub CLI failed."
            LOG_FILE="install-gh.log"
          elif [ "${{ steps.configure_gh.outcome }}" = "failure" ]; then
            STATUS="failure"
            REASON="GitHub CLI authentication failed."
            LOG_FILE="configure-gh.log"
          elif [ "${{ steps.update_contributions.outcome }}" = "failure" ]; then
            STATUS="failure"
            REASON="Contribution refresh failed."
            LOG_FILE="update-readme.log"
          elif [ "${{ steps.commit_changes.outcome }}" = "failure" ]; then
            STATUS="failure"
            REASON="Commit or push failed."
            LOG_FILE="commit.log"
          fi

          {
            echo "status=${STATUS}"
            echo "subject=GitHub Profile Update - ${STATUS^^}"
            echo "body<<EOF"
            echo "GitHub Profile Update Report"
            echo
            echo "Status: ${STATUS}"
            echo "Repository: ${{ github.repository }}"
            echo "Workflow: ${{ github.workflow }}"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "Reason: ${REASON}"
            echo
            if [ -n "${LOG_FILE}" ] && [ -f "${LOG_FILE}" ]; then
              echo "Failure details:"
              tail -n 50 "${LOG_FILE}"
            elif [ "${STATUS}" = "success" ]; then
              echo "Summary:"
              echo "- Contributions section refreshed"
              echo "- Latest PR data included"
            else
              echo "Failure details were not captured in a log file."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # -----------------------
      # 8. Send email (SMTP)
      # -----------------------
      - name: Send email notification
        if: always() && (steps.install_gh.outcome == 'failure' || steps.configure_gh.outcome == 'failure' || steps.update_contributions.outcome == 'failure' || steps.commit_changes.outcome == 'failure' || steps.commit_changes.outputs.changes_made == 'true')
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: ${{ steps.email_content.outputs.subject }}
          to: dhanushka@creately.com
          from: GitHub Actions <${{ secrets.EMAIL_USER }}>
          body: ${{ steps.email_content.outputs.body }}

      - name: Fail workflow if update failed
        if: always() && (steps.install_gh.outcome == 'failure' || steps.configure_gh.outcome == 'failure' || steps.update_contributions.outcome == 'failure' || steps.commit_changes.outcome == 'failure')
        run: |
          echo "${{ steps.email_content.outputs.body }}"
          exit 1
