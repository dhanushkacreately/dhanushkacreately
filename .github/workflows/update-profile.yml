name: Update Profile README

on:
  schedule:
    - cron: "0 18 * * 5" # every Friday

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate log
        run: node generate-log.js

      - name: Commit changes
        run: |
          git config --global user.name "Dhanushka"
          git config --global user.email "your@email.com"
          git add README.md
          git commit -m "Update impact log"
          git push
